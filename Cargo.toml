# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transform-xrust"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transform-xrust"
description = "The xrust XSLT engine: XSLT 1.0, a stylesheet compiled once per thread, includes read from beside it and never over a network. A xmip-core-transform technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability (repository-model.md): the
# engine trait it implements is transform's.
transform = { package = "xmip-core-transform", git = "https://github.com/IlleNilsson/xmip-core-transform", branch = "main" }
# XSLT and XPath in Rust, Apache-2.0; it reads nothing itself and asks its
# caller for every document (ADR-0045).
xrust = "2.3"
# The addresses xrust asks for, read as URLs to be refused or answered
# from the stylesheet's folder.
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
